name: Update space pictures

on:
  schedule:
    - cron: "30 2 * * *"   # every day at 02:30 UTC (08:00 in India)
  workflow_dispatch:        # a "Run" button on GitHub, for testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python make_feed.py nasa-space.csv
      - name: Save the new list
        run: |
          git config user.name "space-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nasa-space.csv entries.json
          git diff --cached --quiet || git commit -m "Update space pictures"
          git push
