name: Update Earth over home

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:          # a "Run" button on GitHub, for testing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: (which ffmpeg && fc-list | grep -q DejaVu) || (sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core)
      - name: Build the pictures and the video
        env:
          LAT: ${{ secrets.LAT }}       # the place is kept in hidden secrets, not in the code
          LON: ${{ secrets.LON }}
          PLACE: ${{ secrets.PLACE }}
          NEWS: ${{ secrets.NEWS }}
          BASE_URL: https://kaipipanwar.github.io/space-feed
        run: python make_feed.py site
      - name: Collect the news and add the Earth Scope app
        env:
          PLACE: ${{ secrets.PLACE }}
          STATE: ${{ secrets.STATE }}
          COUNTRY: ${{ secrets.COUNTRY }}
          NEWS: ${{ secrets.NEWS }}
        run: |
          python make_news.py site
          cp -r scope site/scope
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
