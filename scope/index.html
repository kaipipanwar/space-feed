<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Scope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Everything is drawn on a 1920 x 1080 "screen" that is scaled to fit the window or the TV. -->
<div id="screen">
  <div id="stage"><img id="imgA" alt=""><img id="imgB" alt=""><img id="rain" alt=""></div>
  <canvas id="weather" width="1920" height="1080"></canvas>
  <canvas id="reticle" width="1920" height="1080"></canvas>

  <section id="info" class="panel">
    <h1 id="levelName">EARTH SCOPE</h1>
    <div id="where" class="sub"></div>
    <div id="source" class="sub dim"></div>
    <div class="rule"></div>
    <div id="rows"></div>
    <div id="frameTime"></div>
  </section>

  <div id="clock">
    <div id="time"></div>
    <div id="date"></div>
  </div>

  <section id="side" class="panel">
    <h2 id="sideTitle">SCOPE DATA</h2>
    <div id="sideRows"></div>
  </section>

  <nav id="ladder"></nav>
  <div id="views"></div>
  <div id="status"></div>
  <div id="weatherTag" hidden></div>

  <div id="newsLine"><div id="newsLabel">NEWS</div><div id="newsWindow"><div id="newsText"></div></div></div>

  <form id="setup" hidden>
    <h2>Choose your place</h2>
    <p>Type a city. Nothing is saved anywhere except this browser.</p>
    <input id="setupCity" placeholder="e.g. Bikaner" autocomplete="off">
    <button>Go</button>
    <button type="button" id="setupGps">Use my location</button>
    <p class="dim">Keys: ← → pictures · ↑ ↓ zoom out / in · OK weather · S change place</p>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
